name: Deploy site to GitHub Pages

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Isolate production deploys from PR/develop builds so a preview run
  # cannot cancel an in-flight main deploy (and vice versa).
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Content/structure checks + lab smoke/scan live in content-sync.yml (once per event).
  # This workflow only builds the static site (and deploys from main).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Sync English site copies from sources
        run: ./scripts/sync_en_content.sh
      - name: Generate sitemap, robots.txt, and search indexes
        run: |
          python3 ./scripts/generate_sitemap.py
          python3 ./scripts/generate_search_index.py
      # Pages artifact only when we will (or may) deploy — avoids fork-PR token limits.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        with:
          path: web

  deploy:
    # Production site only — PRs and develop still dry-run build above.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
