version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Production-minded Dockerfiles pin base digests — keep them refreshable.
  - package-ecosystem: docker
    directory: /labs/09-production
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  - package-ecosystem: docker
    directory: /labs/12-ci-cd
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  - package-ecosystem: docker
    directory: /labs/13-capstone
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  # Teaching Node apps share Express (and friends). Bump all six when Dependabot opens PRs.
  - package-ecosystem: npm
    directory: /labs/03-dockerfile
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  - package-ecosystem: npm
    directory: /labs/05-compose
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  - package-ecosystem: npm
    directory: /labs/08-multi-stage
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  - package-ecosystem: npm
    directory: /labs/09-production
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  - package-ecosystem: npm
    directory: /labs/12-ci-cd
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  - package-ecosystem: npm
    directory: /labs/13-capstone
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
