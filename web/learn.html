<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f2f6fa" />
    <link rel="manifest" href="./site.webmanifest" />
    <title>Learn — rean-docker</title>
    <meta name="description" content="Read the rean-docker Docker curriculum chapter by chapter." />
    <link rel="icon" href="./assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./assets/img/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="./assets/img/apple-touch-icon.png" />
    <link rel="stylesheet" href="./assets/css/site.css" />
    <script src="./assets/js/boot.js"></script>
  </head>
  <body class="bg-mesh" data-page="learn" data-i18n-title="learn.title" data-i18n-description="learn.description">
    <rean-header class="site-header" role="banner"></rean-header>

    <div class="backdrop" data-backdrop></div>

    <div class="app-shell">
      <aside class="sidebar" data-sidebar>
        <h2 data-i18n="learn.chapters">Chapters</h2>
        <ul class="side-nav" data-chapter-nav>
          <li class="status" data-i18n="learn.loading">Loading…</li>
        </ul>
      </aside>

      <article class="content-pane">
        <div class="toolbar">
          <button class="btn btn-ghost side-toggle" type="button" data-side-toggle aria-expanded="false" data-i18n="learn.chapters">
            Chapters
          </button>
          <p class="progress-pill" data-progress data-i18n="learn.loadingShort">Loading</p>
        </div>
        <p class="eyebrow" data-i18n="learn.curriculum">Curriculum</p>
        <h1 data-chapter-title data-i18n="learn.loading">Loading…</h1>
        <div class="md-body" data-chapter-body>
          <p class="status" data-i18n="learn.fetching">Fetching handbook…</p>
        </div>
        <nav class="pager" data-pager></nav>
      </article>
    </div>

    <script src="./assets/js/vendor/marked.min.js"></script>
    <script src="./assets/js/vendor/purify.min.js"></script>
    <script src="./assets/js/i18n-km.js"></script>
    <script src="./assets/js/i18n.js"></script>
    <script src="./assets/js/site.js"></script>
    <script src="./assets/js/learn.js"></script>
  </body>
</html>
