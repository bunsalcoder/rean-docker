name: Deploy site to GitHub Pages

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Isolate production deploys from PR/develop builds so a preview run
  # cannot cancel an in-flight main deploy (and vice versa).
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify English content copies match sources
        run: ./scripts/check_content_sync.sh
      - name: Verify Khmer content matches English structure
        run: ./scripts/check_km_content.sh
      - name: Verify Khmer teaching parity
        run: ./scripts/check_km_parity.sh

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Sync English site copies from sources
        run: ./scripts/sync_en_content.sh
      - name: Generate sitemap and robots.txt
        run: python3 ./scripts/generate_sitemap.py
      # Pages artifact only when we will (or may) deploy — avoids fork-PR token limits.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        with:
          path: web

  deploy:
    # Production site only — PRs and develop still run check+build above.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
