# Lab 13 Compose pins Postgres/Redis by digest. Dependabot does not cover those
# `image:` lines — fail loudly when Hub moves the series tag.
name: Compose digest drift

on:
  schedule:
    # Mondays 06:00 UTC — after weekend Hub churn, before the work week.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Fail if Lab 13 Compose digests drifted from Hub
        run: make refresh-digests-check
