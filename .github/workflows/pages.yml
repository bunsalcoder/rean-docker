name: Deploy site to GitHub Pages

on:
  # Deploy (and dry-run build on develop) only after CI succeeds — keeps a
  # broken lab/Trivy failure from shipping the learning site on main.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Isolate production deploys from PR/develop builds so a preview run
  # cannot cancel an in-flight main deploy (and vice versa).
  group: pages-${{ github.event_name }}-${{ github.ref }}-${{ github.event.workflow_run.head_branch || github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    # PR / manual: always build. workflow_run: only after a successful CI push.
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Sync English site copies from sources
        run: ./scripts/sync_en_content.sh
      - name: Generate sitemap, robots.txt, and search indexes
        run: |
          python3 ./scripts/generate_sitemap.py
          python3 ./scripts/generate_search_index.py
      - name: Verify generated site artifacts are committed
        run: |
          if ! git diff --exit-code -- \
            web/sitemap.xml \
            web/robots.txt \
            web/assets/search-index-en.json \
            web/assets/search-index-km.json; then
            echo "::error::Generated site artifacts drifted from git. Run: make sitemap && commit the results."
            exit 1
          fi
      # Pages artifact only when we will (or may) deploy — avoids fork-PR token limits.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        if: |
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.head_branch == 'main')
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: |
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.head_branch == 'main')
        with:
          path: web

  deploy:
    # Production site only — after CI on main, or manual dispatch from main.
    if: |
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
