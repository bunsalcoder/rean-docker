services:
  api:
    # IMAGE_REF is ":sha-…" (tag) or "@sha256:…" (digest). Required — no :latest default.
    image: ghcr.io/${REGISTRY_OWNER:-YOUR_USER}/rean-deploy-api${IMAGE_REF:?set IMAGE_REF to :sha-… or @sha256:…}
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      APP_VERSION: ${APP_VERSION:-unknown}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
