# Copy this file to your repo root as:
#   .github/workflows/rean-deploy-ci.yml
# Adjust paths if your app is not under labs/12-ci-cd.

name: CI — build, smoke, push

on:
  push:
    branches: [main]
    paths:
      - "labs/12-ci-cd/**"
      - ".github/workflows/rean-deploy-ci.yml"
  pull_request:
    paths:
      - "labs/12-ci-cd/**"

# Least privilege: workflow default is read-only. The push job alone
# adds packages:write (Chapter 17 / Lab 11 supply-chain habits).
permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/rean-deploy-api
  WORKDIR: labs/12-ci-cd

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate Compose files
        working-directory: ${{ env.WORKDIR }}
        run: |
          docker compose -f compose.yaml config >/dev/null
          docker compose -f compose.yaml -f compose.proxy.yaml config >/dev/null
          REGISTRY_OWNER=example IMAGE_REF=:sha-deadbee \
            docker compose -f compose.prod.yaml config >/dev/null

      - name: Build image
        working-directory: ${{ env.WORKDIR }}
        run: |
          TAG=sha-$(git rev-parse --short HEAD)
          docker build -t "$IMAGE:$TAG" .
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Smoke test
        working-directory: ${{ env.WORKDIR }}
        run: |
          docker compose up -d --build --wait --wait-timeout 60
          curl -fsS http://127.0.0.1:3000/health
          echo

      # Stretch (Chapter 15 / 17) — uncomment when you want CI to scan before push.
      # Prefer tar + --input (same pattern as this repo's root .github/workflows/ci.yml).
      # Do not mount /var/run/docker.sock — that is nearly root on the host (Lab 11).
      # - name: Scan image (Trivy)
      #   run: |
      #     TRIVY_IMAGE='aquasec/trivy:0.63.0'
      #     tar="/tmp/rean-trivy-$TAG.tar"
      #     docker save "$IMAGE:$TAG" -o "$tar"
      #     docker run --rm -v /tmp:/in "$TRIVY_IMAGE" image \
      #       --input "/in/$(basename "$tar")" \
      #       --severity CRITICAL --exit-code 1
      #
      # Stretch — attach SBOM/provenance when you push with buildx:
      #   docker buildx build --sbom=true --provenance=true -t "$IMAGE:$TAG" --push .

      - name: Teardown smoke stack
        if: always()
        working-directory: ${{ env.WORKDIR }}
        run: docker compose down -v

  push:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build and push image
        working-directory: ${{ env.WORKDIR }}
        run: |
          TAG=sha-$(git rev-parse --short HEAD)
          docker build -t "$IMAGE:$TAG" .
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
