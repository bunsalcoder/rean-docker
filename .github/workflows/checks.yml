name: Content checks

on:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify English content copies match sources
        run: ./scripts/check_content_sync.sh
      - name: Verify Khmer content matches English structure
        run: ./scripts/check_km_content.sh
      - name: Verify Khmer teaching parity
        run: ./scripts/check_km_parity.sh
      - name: Verify shared lab hardening invariants
        run: ./scripts/check_lab_invariants.sh
      - name: Verify local site links
        run: python3 ./scripts/check_site_links.py
      - name: Verify vendor script SRI hashes
        run: ./scripts/check_vendor_sri.sh
      - name: Regenerate sitemap, robots.txt, and search indexes
        run: |
          python3 ./scripts/generate_sitemap.py
          python3 ./scripts/generate_search_index.py
      - name: Verify generated site artifacts are committed
        run: |
          if ! git diff --exit-code -- \
            web/sitemap.xml \
            web/robots.txt \
            web/assets/search-index-en.json \
            web/assets/search-index-km.json; then
            echo "::error::Generated site artifacts drifted from git. Run: make sitemap && commit the results."
            exit 1
          fi
