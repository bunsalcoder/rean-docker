name: Content checks

on:
  workflow_call:

# Least privilege: sync/parity/link checks only need a read-only checkout.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify English content copies match sources
        run: ./scripts/check_content_sync.sh
      - name: Verify Khmer content matches English structure
        run: ./scripts/check_km_content.sh
      - name: Verify Khmer teaching parity
        run: ./scripts/check_km_parity.sh
      - name: Verify Khmer handbook subsection headings are not Latin-only
        run: python3 ./scripts/check_km_headings.py
      - name: Shellcheck lab and repo scripts
        run: |
          set -euo pipefail
          # Pin ShellCheck by release asset (no apt). Refresh when upgrading.
          SC_VER=v0.10.0
          curl -fsSL -o /tmp/shellcheck.tgz \
            "https://github.com/koalaman/shellcheck/releases/download/${SC_VER}/shellcheck-${SC_VER}.linux.x86_64.tar.xz"
          tar -xJf /tmp/shellcheck.tgz -C /tmp
          "/tmp/shellcheck-${SC_VER}/shellcheck" scripts/*.sh labs/*/run.sh
      - name: Verify shared lab hardening invariants
        run: ./scripts/check_lab_invariants.sh
      - name: Verify routes.js matches routes.json
        run: ./scripts/check_routes_sync.sh
      - name: Verify local site links
        run: python3 ./scripts/check_site_links.py
      - name: Verify vendor script SRI hashes
        run: ./scripts/check_vendor_sri.sh
      - name: Verify vendor versions match package.json
        run: ./scripts/check_vendor_versions.sh
      - name: Install site npm deps (marked for static pages)
        run: cd web && npm ci --ignore-scripts
      - name: Regenerate static pages, sitemap, robots.txt, and search indexes
        run: |
          cd web && node ../scripts/generate_static_pages.mjs
          python3 ./scripts/generate_sitemap.py
          python3 ./scripts/generate_search_index.py
      - name: Verify generated site artifacts are committed
        run: |
          if ! git diff --exit-code -- \
            web/sitemap.xml \
            web/robots.txt \
            web/assets/search-index-en.json \
            web/assets/search-index-km.json \
            web/learn \
            web/lab; then
            echo "::error::Generated site artifacts drifted from git. Run: make sitemap && commit the results."
            exit 1
          fi
      - name: Smoke-test static site pages and indexes
        run: python3 ./scripts/check_site_smoke.py
