version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # CRITICAL-gated / production-minded Dockerfiles pin base digests — keep them refreshable.
  # Labs 12 and 13 Dockerfiles are byte-copies of Lab 09 (make sync-prod-dockerfiles).
  # Watch only 09 here so Dependabot does not open three twin PRs that break CI.
  # After a Lab 09 base bump merges on develop, .github/workflows/sync-prod-dockerfiles.yml
  # opens a PR that copies 09 → 12/13. Prefer still running: make sync-prod-dockerfiles.
  # Compose image digests (Lab 13 Postgres/Redis) are not covered here; run:
  #   make refresh-digests
  # Weekly workflow: .github/workflows/digests.yml → refresh + open PR on drift
  - package-ecosystem: docker
    directory: /labs/05-compose
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  - package-ecosystem: docker
    directory: /labs/08-multi-stage
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  - package-ecosystem: docker
    directory: /labs/09-production
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  # Teaching Node apps share Express (and friends) across six lab folders.
  # Dependabot cannot open one multi-directory npm PR, and six separate PRs break
  # check-lab-invariants unless merged together. Bump coordinated via:
  #   make bump-node-deps PKG=express@^4.22.0
  # Do not re-add per-lab npm ecosystems here.

  # Self-hosted marked + DOMPurify (copied into assets/js/vendor/).
  # Before merging a /web bump PR, run locally (CI will fail otherwise):
  #   make vendor-site && make check-vendor-sri && make check-vendor-versions
  - package-ecosystem: npm
    directory: /web
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      site-vendor:
        patterns:
          - "*"
